# Preview deploy to GitHub Pages: https://gr-vive.github.io/iffecta-site/
# Production stays on Beget (docs/DEPLOY.md). Pages serves the site under /iffecta-site/,
# so the build step prefixes every root-relative URL with that path.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build preview copy with /iffecta-site/ prefix
        env:
          BASE: /iffecta-site
        run: |
          rm -rf dist && cp -r public dist
          rm -f dist/.htaccess
          touch dist/.nojekyll
          find dist \( -name '*.html' -o -name '*.webmanifest' -o -name '*.css' -o -name '*.js' \) -print0 \
            | xargs -0 sed -i -E \
                -e "s#=\"/\"#=\"${BASE}/\"#g" \
                -e "s#=\"/([^/\"])#=\"${BASE}/\\1#g" \
                -e "s#\": \"/\"#\": \"${BASE}/\"#g" \
                -e "s#\": \"/([^/\"])#\": \"${BASE}/\\1#g"
          echo "--- sanity check"
          grep -o 'href="[^"]*site.css"' dist/index.html
          grep -o 'data-src-desktop="[^"]*"' dist/index.html
          grep -o '"start_url": "[^"]*"' dist/site.webmanifest

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
